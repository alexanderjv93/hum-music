<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hum — make a song</title>
  <meta name="description" content="Describe a song and hear it a minute later.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23d9432a'/><circle cx='16' cy='16' r='4' fill='%23f4efe4'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <span class="wordmark">Hum</span>
      <span class="eyebrow">Songs from a sentence</span>
    </header>

    <section class="studio" aria-label="Make a song">
      <h1>What should it sound like?</h1>

      <div class="tabs" role="tablist" aria-label="How to make your song">
        <button type="button" role="tab" id="tab-simple" aria-selected="true" aria-controls="form">Describe it</button>
        <button type="button" role="tab" id="tab-custom" aria-selected="false" aria-controls="form">Write it yourself</button>
      </div>

      <form id="form" novalidate>
        <div class="simple-only">
          <label class="sr-only" for="prompt">Describe your song</label>
          <textarea id="prompt" class="big" rows="3" maxlength="3000" placeholder="A slow country ballad about leaving a small town, with a warm female voice"></textarea>
          <div class="chips" id="ideas" aria-label="Song ideas"></div>
        </div>

        <div class="custom-only" hidden>
          <div class="field">
            <label for="style">Style</label>
            <input id="style" maxlength="1000" placeholder="Indie folk, fingerpicked guitar, intimate">
          </div>
          <div class="field">
            <label for="title">Title <span class="hint">optional</span></label>
            <input id="title" maxlength="80" placeholder="Name your song">
          </div>
          <div class="field vocals-only">
            <div class="label-row">
              <label for="lyrics">Lyrics</label>
              <button type="button" class="text-btn" id="lyrics-toggle">Write them for me</button>
            </div>
            <div class="lyric-helper" id="lyric-helper" hidden>
              <label class="sr-only" for="lyric-prompt">What should the lyrics be about?</label>
              <input id="lyric-prompt" maxlength="200" placeholder="What should the lyrics be about?">
              <button type="button" class="btn-secondary" id="lyric-go">Write</button>
            </div>
            <p class="status-line" id="lyric-status" role="status" hidden></p>
            <textarea id="lyrics" rows="8" maxlength="5000" placeholder="[Verse]&#10;Porch light on and the engine cold&#10;&#10;[Chorus]&#10;..."></textarea>
          </div>
          <div class="field">
            <label for="duration">Length <output id="duration-out" for="duration">2:00</output></label>
            <input id="duration" type="range" min="10" max="360" step="10" value="120">
          </div>
          <div class="field">
            <label for="negative">Leave out <span class="hint">optional</span></label>
            <input id="negative" maxlength="1000" placeholder="Heavy drums, autotune">
          </div>
          <div class="field vocals-only">
            <label for="voice">Voice</label>
            <select id="voice">
              <option value="">No preference</option>
              <option value="f">Female</option>
              <option value="m">Male</option>
            </select>
          </div>
        </div>

        <div class="options">
          <label class="check"><input type="checkbox" id="instrumental"> Instrumental, no vocals</label>
          <label class="model">Model
            <select id="model">
              <option value="V6">V6, best quality</option>
              <option value="V6_WILD">V6 Wild, more experimental</option>
              <option value="V6_MINI">V6 Mini, lighter</option>
            </select>
          </label>
        </div>

        <div class="field" id="access-field" hidden>
          <label for="access">Access code</label>
          <input id="access" type="password" autocomplete="off">
        </div>

        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button type="submit" class="btn-primary" id="submit">Make my song</button>
      </form>
    </section>

    <section class="library" aria-labelledby="library-title">
      <h2 id="library-title">Your songs</h2>
      <p class="note">Saved in this browser. Download anything you want to keep, because songs expire after 14 days.</p>
      <div id="library"></div>
    </section>
  </main>

  <div class="player" id="player" hidden>
    <button type="button" class="play-btn" id="player-toggle" aria-label="Pause"></button>
    <div class="player-info">
      <span class="player-title" id="player-title"></span>
      <div class="player-seek">
        <span id="player-now">0:00</span>
        <input id="player-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek">
        <span id="player-total">0:00</span>
      </div>
    </div>
  </div>
  <audio id="audio" preload="none"></audio>

  <script src="app.js"></script>
</body>
</html>
